[project]
name = "pythonproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datadog-api-client>=2.48.0",
    "dotenv>=0.9.9",
    "mimesis>=18.0.0",
    "pillow>=11.3.0",
    "playwright>=1.60.0",
    "pydantic[email]>=2.10.6",
    "pydantic-settings>=2.14.1",
    "pymysql>=1.1.3",
    "pytest>=8.3.5",
    "pytest-forked>=1.6.0",
    "pytest-playwright>=0.8.0",
    "pytest-xdist>=3.6.1",
    "requests>=2.32.3",
    "sqlalchemy>=2.0.49",
    "urllib3>=2.7.0",
    "pytest-mock>=3.14.0",
    "pytest-repeat>=0.9.4",
    "playwright-stealth>=2.0.3",
]


[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
log_date_format = "%H:%M:%S"
markers = [
    "smoke: критичные проверки, запускаются в первую очередь",
    "regression: полный регрессионный набор",
    "ui: все UI-тесты (Playwright)",
    "api: все API-тесты (requests)",
    "appfollow: тестовое задание для команды appfollow"
]
