name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aqa-portfolio:ci .

      - name: Run smoke tests in container
        run: |
          docker run --rm \
            -e LOGIN="${{ secrets.LOGIN }}" \
            -e PASSWORD="${{ secrets.PASSWORD }}" \
            aqa-portfolio:ci